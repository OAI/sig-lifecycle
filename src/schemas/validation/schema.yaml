$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://spec.openapis.org/lifecycle/1.0/schema/WORK-IN-PROGRESS'
title: Lifecycle Schema
description: Validates a Lifecycle Object.

$ref: '#/$defs/lifecycle'

$defs:
  lifecycle:
    description: Deprecation and sunset status of a single operation.
    type: object
    required:
      - date
    properties:
      date:
        type: string
        format: date-time
      reason:
        type: string
      sunset:
        $ref: '#/$defs/sunset'
      externalLinks:
        type: array
        items:
          $ref: '#/$defs/lifecycle-link'
    unevaluatedProperties: false

  sunset:
    description: When an operation is expected to stop accepting requests.
    type: object
    required:
      - date
    properties:
      date:
        type: string
        format: date-time
    unevaluatedProperties: false

  # An External Documentation Object in lifecycle.externalLinks, where kind is required.
  lifecycle-link:
    $ref: '#/$defs/external-documentation'
    required:
      - kind

  # External Documentation Object as extended by the OAS Docs Links proposal.
  external-documentation:
    type: object
    required:
      - url
    properties:
      summary:
        type: string
      description:
        type: string
      url:
        type: string
        format: uri-reference
      kind:
        type: string
    $ref: '#/$defs/specification-extensions'
    unevaluatedProperties: false

  specification-extensions:
    patternProperties:
      '^x-': true
